<!DOCTYPE html>
<html>

<head>
    <title>Password Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <script src="pass_gen.js"></script>
</head>

<body>
    <div class="container">
        <div class="input-group mb-3">
            <span class="input-group-text">Input</span>
            <input type="text" class="form-control" id="input">
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" checked class="form-check-input" name="limited_characters" id="limited_characters">
            <label class="form-check-label" for="limited_characters">
                Limited characters
            </label>
        </div>
        <div class="input-group mb-3">
            <input type="button" class="form-control" value="Convert" py-click="generate_pass">
            <input type="button" class="form-control" value="Convert (JS)", id="gen_btn_js">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">Output</span>
            <input type="text" class="form-control" id="output" disabled>
        </div>
        <div class="mb-3" id="message"></div>
    </div>

    <script type="py" src="./event.py" config="./pyscript.json"></script>
</body>

</html>
